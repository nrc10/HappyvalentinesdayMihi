<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    h1 { margin-top: 50px; font-size: 28px; }

    #yayText { display: none; font-size: 32px; color: #ff4d6d; margin: 20px 0; }

    #buttons {
      margin-top: 30px;
      position: relative;
      width: 260px;
      height: 60px;
    }

    button {
      width: 120px;          /* FIXED WIDTH */
      height: 50px;          /* FIXED HEIGHT */
      line-height: 26px;     /* vertical text centering */
      padding: 0;            /* reset padding to avoid stretching */
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      text-align: center;
      transition: left 0.3s, top 0.3s; /* smooth movement */
    }

    #yesBtn { left: 0; background: #ff4d6d; color: white; }
    #noBtn  { right: 0; background: white; color: #ff4d6d; }

    #letter, #gallery {
      display: none;
      margin-top: 20px;
      max-width: 90%;
    }

    #letter p { margin-top: 10px; font-size: 18px; color: #fff; }

    .gallery {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: nowrap;
    }

    .gallery img {
      width: 150px;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <h1 id="mainTitle">Will you be my Valentine? 💘</h1>
  <div id="yayText">YAY 💕</div>

  <div id="buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 💔</button>
  </div>

  <div id="letter">
    <h2>My Love Letter 💌</h2>
    <p>Somewhere between laughs and late replies, you became my favorite person 💕</p>
  </div>

  <div id="gallery">
    <h2>Us 🥹</h2>
    <div class="gallery">
      <img src="https://picsum.photos/200?1" alt="Us 1">
      <img src="https://picsum.photos/200?2" alt="Us 2">
      <img src="https://picsum.photos/200?3" alt="Us 3">
    </div>
  </div>

  <!-- Hidden audio -->
  <audio id="valentineAudio" src="YOUR_AUDIO_URL_HERE.mp3"></audio>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const yayText = document.getElementById("yayText");
    const mainTitle = document.getElementById("mainTitle");
    const letter = document.getElementById("letter");
    const gallery = document.getElementById("gallery");
    const audio = document.getElementById("valentineAudio");

    // Store original NO button position
    const originalLeft = noBtn.offsetLeft;
    const originalTop = noBtn.offsetTop;
    let escaped = false;

    // Move NO button randomly anywhere on screen
    function moveNo() {
      if (!escaped) escaped = true;
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.position = "fixed";
    }

    // NO button moves on hover or click
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("click", moveNo);

    // Reset NO button when YES hovered
    yesBtn.addEventListener("mouseenter", () => {
      noBtn.style.position = "absolute";
      noBtn.style.left = originalLeft + "px";
      noBtn.style.top = originalTop + "px";
      escaped = false;
    });

    // YES click shows YAY, letter, gallery and plays audio
    yesBtn.addEventListener("click", () => {
      yesBtn.style.display = "none";
      noBtn.style.display = "none";

      mainTitle.textContent = "Cheers to our first Valentine's Day! 🥂";
      yayText.style.display = "block";
      letter.style.display = "block";
      gallery.style.display = "block";

      audio.play().catch(err => console.log("Audio playback blocked:", err));
    });
  </script>

</body>
</html>
