<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: pink;
      text-align: center;
    }

    h1 { margin-top: 50px; }

    #buttons { margin-top: 30px; position: relative; height: 50px; }

    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      position: absolute;
    }

    #yesBtn { left: 0; background: red; color: white; }
    #noBtn { right: 0; background: white; color: red; }

    #yayText { display: none; font-size: 24px; color: red; margin: 20px 0; }

    #letter, #gallery { display: none; margin-top: 20px; }

    .gallery img { width: 150px; height: 200px; margin: 5px; object-fit: cover; }

  </style>
</head>
<body>

  <h1 id="mainTitle">Will you be my Valentine? 💘</h1>

  <div id="yayText">YAY 💕</div>

  <div id="buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 💔</button>
  </div>

  <div id="letter">
    <h2>My Love Letter 💌</h2>
    <p>Somewhere between laughs and late replies, you became my favorite person 💕</p>
  </div>

  <div id="gallery">
    <h2>Us 🥹</h2>
    <img src="https://picsum.photos/200?1" alt="Us 1">
    <img src="https://picsum.photos/200?2" alt="Us 2">
    <img src="https://picsum.photos/200?3" alt="Us 3">
  </div>

  <!-- Hidden audio -->
  <audio id="valentineAudio" src="YOUR_AUDIO_URL_HERE.mp3"></audio>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const yayText = document.getElementById("yayText");
    const mainTitle = document.getElementById("mainTitle");
    const letter = document.getElementById("letter");
    const gallery = document.getElementById("gallery");
    const audio = document.getElementById("valentineAudio");

    const originalLeft = noBtn.offsetLeft;
    const originalTop = noBtn.offsetTop;
    let escaped = false;

    function moveNo() {
      if (!escaped) escaped = true;
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.position = "fixed";
    }

    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("click", moveNo);

    yesBtn.addEventListener("mouseenter", () => {
      noBtn.style.position = "absolute";
      noBtn.style.left = originalLeft + "px";
      noBtn.style.top = originalTop + "px";
      escaped = false;
    });

    yesBtn.addEventListener("click", () => {
      yesBtn.style.display = "none";
      noBtn.style.display = "none";

      mainTitle.textContent = "Cheers to our first Valentine's Day! 🥂";
      yayText.style.display = "block";
      letter.style.display = "block";
      gallery.style.display = "block";

      audio.play().catch(err => console.log(err));
    });
  </script>

</body>
</html>
