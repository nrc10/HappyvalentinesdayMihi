<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(#ff9a9e,#fad0c4);
font-family:'Comic Sans MS', cursive;
overflow:hidden;
}

.container{
text-align:center;
color:white;
}

/* Teddy */

#teddy{
width:170px;
animation:bounce 1.6s infinite;
margin-bottom:15px;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-25px);}
}

/* Question */

h1{
font-size:2.3em;
margin-bottom:20px;
}

/* Button wrapper */

.buttons{
position:relative;
width:320px;
height:70px;
margin:auto;
}

/* Buttons */

button{
position:absolute;
border:none;
padding:14px 36px;
border-radius:40px;
font-size:18px;
cursor:pointer;
transition:none;
}

/* YES */

#yesBtn{
background:#ff4f7b;
color:white;
left:0;
}

/* NO */

#noBtn{
background:white;
color:#ff4f7b;
right:0;
}

/* Hidden */

.hidden{display:none}

/* Hearts */

.heart{
position:fixed;
color:red;
font-size:22px;
animation:floatUp 4s linear forwards;
}

@keyframes floatUp{
0%{transform:translateY(0);opacity:1;}
100%{transform:translateY(-600px);opacity:0;}
}

/* Burst */

.burst{
position:fixed;
width:12px;
height:12px;
background:red;
border-radius:50%;
animation:burst 1s forwards;
}

@keyframes burst{
to{
transform:translate(var(--x),var(--y)) scale(0);
opacity:0;
}
}

/* Celebration */

#celebration{
margin-top:30px;
}

.gallery{
display:flex;
gap:15px;
justify-content:center;
margin-top:20px;
flex-wrap:wrap;
}

.gallery img{
width:300px;
height:320px;
object-fit:cover;
border-radius:20px;
}

</style>
</head>

<body>

<div class="container">

<img id="teddy"
src="https://imgs.search.brave.com/wO9V1f4mWiGl34wF3Rf49O5PefQNkBsIji-YxuMMovk/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9wbmcu/cG5ndHJlZS5jb20v/cG5nLXZlY3Rvci8y/MDI0MDgwMS9vdXJt/aWQvcG5ndHJlZS1i/ZWF1dGlmdWwtZW1v/amktdGVkZHktYmVh/ci1zdGlja2VyLXBu/Zy1pbWFnZV8xMzMy/Mjk3MC5wbmc">

<h1 id="question">Will you be my Valentine? 💖</h1>

<div class="buttons">
<button id="yesBtn">YES 💘</button>
<button id="noBtn">NO 💔</button>
</div>

<div id="celebration" class="hidden">

<h2>Cheers to our first Valentine’s Day 🥂</h2>
<h1>YAY 💕</h1>

<p>Somewhere between laughs and late replies,  
you became my favorite person 💖</p>

<div class="gallery">
<img src="IMG-20250527-WA0035~2.jpg">
<img src="Screenshot_20250430-220507.jpg">
</div>

</div>

<audio id="music"
src="Valentine\Zara Sa - Trending Version  1 Min Music Video  Jannat  Emraan Hashmi, Sonal  KK  Pritam.mp3"></audio>

</div>

<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const question = document.getElementById("question");
const teddy = document.getElementById("teddy");
const celebration = document.getElementById("celebration");
const music = document.getElementById("music");

/* Store original NO position */

const original = { x:0, y:0 };

window.onload = ()=>{
const r = noBtn.getBoundingClientRect();
original.x = r.left;
original.y = r.top;
};

/* NO hover = teleport */

noBtn.addEventListener("mouseenter",()=>{

const x = Math.random()*(window.innerWidth-120);
const y = Math.random()*(window.innerHeight-120);

noBtn.style.transform = 
`translate(${x-original.x}px, ${y-original.y}px)`;

});

/* YES hover = reset NO */

yesBtn.addEventListener("mouseenter",()=>{
noBtn.style.transform="translate(0,0)";
});

/* YES click */

yesBtn.addEventListener("click",()=>{

document.querySelector(".buttons").style.height = "0px";

yesBtn.style.display="none";
noBtn.style.display="none";
question.style.display="none";

teddy.src="https://imgs.search.brave.com/SDYB0IPQt1koX0PFrUq37dsOk1-p8T3xWQAgZBxtn08/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pLnBp/bmltZy5jb20vb3Jp/Z2luYWxzLzIwLzRj/L2YwLzIwNGNmMDI4/ZWRlMGQ1NjkwODg2/ZjFjNjFhNDZmZTlm/LmpwZw";

celebration.classList.remove("hidden");
music.play();

loveBurst();
startHearts();

});

/* Hearts */

function startHearts(){
setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*window.innerWidth+"px";
h.style.bottom="0px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),4000);
},300);
}

/* Burst */

function loveBurst(){
for(let i=0;i<30;i++){
const b=document.createElement("div");
b.className="burst";
b.style.left="50%";
b.style.top="50%";
b.style.setProperty("--x",(Math.random()*400-200)+"px");
b.style.setProperty("--y",(Math.random()*400-200)+"px");
document.body.appendChild(b);
setTimeout(()=>b.remove(),1000);
}
}

</script>

</body>
</html>
