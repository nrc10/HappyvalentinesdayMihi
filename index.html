<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💘</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  overflow-x: hidden;
  position: relative;
}

h1 { margin-top: 50px; font-size: 28px; }

#yayText { display: none; font-size: 32px; color: #ff4d6d; margin: 20px 0; }

#buttons {
  margin-top: 30px;
  position: relative;
  width: 260px;
  height: 60px;
}

button {
  width: 120px;
  height: 50px;
  line-height: 26px;
  padding: 0;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  position: absolute;
  text-align: center;
  transition: left 0.3s, top 0.3s;
}

#yesBtn { left: 0; background: #ff4d6d; color: white; }
#noBtn  { right: 0; background: white; color: #ff4d6d; }

#teddyBear {
  display: none;
  width: 180px;
  margin-top: 20px;
}

#letter, #gallery {
  display: none;
  margin-top: 20px;
  max-width: 90%;
}

#letter p { margin-top: 10px; font-size: 18px; color: #fff; }

.gallery {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
  flex-wrap: nowrap;
}

.gallery img {
  width: 150px;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
  flex-shrink: 0;
}

/* Floating hearts */
.heart {
  position: fixed;
  width: 20px;
  height: 20px;
  background: red;
  clip-path: polygon(50% 0%, 61% 12%, 75% 12%, 85% 25%, 100% 38%, 88% 50%, 50% 100%, 12% 50%, 0% 38%, 15% 25%, 25% 12%, 39% 12%);
  animation: floatUp 3s linear forwards;
  z-index: 1000;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-400px) scale(1.5); opacity: 0; }
}
</style>
</head>
<body>

<h1 id="mainTitle">Will you be my Valentine? 💘</h1>
<div id="yayText">YAY 💕</div>

<div id="buttons">
  <button id="yesBtn">YES 💖</button>
  <button id="noBtn">NO 💔</button>
</div>

<img id="teddyBear" src="https://i.ibb.co/2c1f0G3/teddy.png" alt="Teddy Bear">

<div id="letter">
  <h2>My Love Letter 💌</h2>
  <p>Somewhere between laughs and late replies, you became my favorite person 💕</p>
</div>

<div id="gallery">
  <h2>Us 🥹</h2>
  <div class="gallery">
    <img src="https://picsum.photos/200?1" alt="Us 1">
    <img src="https://picsum.photos/200?2" alt="Us 2">
    <img src="https://picsum.photos/200?3" alt="Us 3">
  </div>
</div>

<!-- Hidden audio -->
<audio id="valentineAudio" src="YOUR_AUDIO_URL_HERE.mp3"></audio>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const yayText = document.getElementById("yayText");
const mainTitle = document.getElementById("mainTitle");
const letter = document.getElementById("letter");
const gallery = document.getElementById("gallery");
const teddy = document.getElementById("teddyBear");
const audio = document.getElementById("valentineAudio");

const originalLeft = noBtn.offsetLeft;
const originalTop = noBtn.offsetTop;
let escaped = false;

// Move NO button randomly
function moveNo() {
  if (!escaped) escaped = true;
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  noBtn.style.position = "fixed";
}

noBtn.addEventListener("mouseenter", moveNo);
noBtn.addEventListener("click", moveNo);

// Reset NO button on YES hover
yesBtn.addEventListener("mouseenter", () => {
  noBtn.style.position = "absolute";
  noBtn.style.left = originalLeft + "px";
  noBtn.style.top = originalTop + "px";
  escaped = false;
});

// Generate floating hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.style.left = Math.random() * window.innerWidth + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 3000);
}

// YES click event
yesBtn.addEventListener("click", () => {
  yesBtn.style.display = "none";
  noBtn.style.display = "none";

  mainTitle.textContent = "Cheers to our first Valentine's Day! 🥂";
  yayText.style.display = "block";
  teddy.style.display = "block";
  letter.style.display = "block";
  gallery.style.display = "block";

  audio.play().catch(err => console.log("Audio playback blocked:", err));

  // Create hearts every 300ms
  setInterval(createHeart, 300);
});
</script>

</body>
</html>
